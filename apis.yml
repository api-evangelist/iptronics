name: IPtronics
description: 'IPtronics A/S was a fabless semiconductor company founded in 2003 in Copenhagen, Denmark,
  designing integrated circuits (laser drivers, transimpedance amplifiers, and CMOS ICs) for parallel
  optical interconnects used in high-speed computing, storage, and datacenter communications. Backed by
  Creandum, Sunstone, and 10i10, the company was acquired by Mellanox Technologies in 2013 (now part of
  NVIDIA) and no longer operates as an independent entity. It is a hardware chip vendor with no public
  API, developer portal, SDK, or programmatic surface; the former iptronics.com domain now redirects to
  NVIDIA Networking. Retained in the API Evangelist network as a VC-portfolio identity record only.'
